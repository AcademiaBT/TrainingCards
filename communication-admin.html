<!doctype html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Nodul comunicării · Trainer</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="communication.css">
</head>
<body>
  <header class="app-header">
    <div>
      <div class="eyebrow">Activități online</div>
      <h1>Nodul comunicării · Trainer</h1>
    </div>
    <a class="btn outline header-link" href="admin.html">← Carduri de training</a>
  </header>

  <main>
    <section id="auth-box" class="panel">
      <h2>Autentificare trainer</h2>
      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Parolă">
      <button class="btn" id="login">Intră</button>
      <div class="error-msg" id="auth-error"></div>
    </section>

    <section id="creator" class="panel" hidden>
      <h2>Creează activitatea</h2>
      <div class="comm-grid three">
        <button class="mode-card" data-mode="draw">
          <b>1. Desenează după instrucțiuni</b>
          <span>Canvas individual, două runde și comparare.</span>
        </button>
        <button class="mode-card" data-mode="model">
          <b>2. Reconstruiește modelul</b>
          <span>Piese pe grilă, model-țintă și reveal.</span>
        </button>
        <button class="mode-card" data-mode="client">
          <b>3. Ce ai înțeles?</b>
          <span>Mesaj ambiguu, clarificare și răspuns.</span>
        </button>
      </div>
    </section>

    <section id="live" hidden>
      <div class="panel">
        <div class="comm-toolbar">
          <div>
            <span class="badge" id="mode-badge"></span>
            <h2 id="activity-title"></h2>
          </div>
          <button class="btn danger" id="end">Încheie</button>
        </div>
        <p>Link participanți:</p>
        <div class="session-link-box">
          <span id="join-link"></span>
          <button class="btn outline" id="copy">Copiază</button>
        </div>
        <div style="display:flex; gap:8px; flex-wrap:wrap; margin-top:10px;">
          <button class="btn outline" id="qr-btn" style="font-size:12px; padding:5px 10px;">Arată codul QR</button>
          <button class="btn outline" id="qr-dl-png-btn" style="font-size:12px; padding:5px 10px;">⬇ Descarcă PNG</button>
          <button class="btn outline" id="qr-dl-jpg-btn" style="font-size:12px; padding:5px 10px;">⬇ Descarcă JPG</button>
        </div>
        <img id="qr-img" alt="Cod QR" style="display:none; margin-top:8px; width:160px; height:160px; border-radius:8px; border:1px solid var(--parchment-dark); background:#fff;">
        <p id="status-line"></p>
        <div class="comm-toolbar">
          <button class="btn" id="back">← Etapa anterioară</button>
          <button class="btn gold" id="next">Etapa următoare →</button>
        </div>
      </div>

      <div class="comm-grid two">
        <section class="panel">
          <h3>Instrucțiuni trainer</h3>
          <div id="trainer-prompt"></div>
          <div id="target"></div>
          <h3>Participanți</h3>
          <div id="participants"></div>
        </section>
        <section class="panel">
          <h3>Rezultate</h3>
          <div id="results" class="results-grid"></div>
        </section>
      </div>
    </section>
  </main>

  <script type="module" src="communication-admin.js"></script>
</body>
</html>
